[package]
name = "back"
version = "0.1.0"
edition = "2024"

[dependencies]
async-stream = "0.3.6"
axum = { version = "0.8.4", features = ["multipart", "macros", "ws"] }
axum-extra = { version = "0.10.1", features = ["cookie"] }
chrono = { version = "0.4.41", features = ["serde"] }
dotenvy = "0.15.7"
eyre = "0.6.12"
jsonwebtoken = "9.3.1"
multer = "3.1.0"
nom = "8.0.0"
reqwest = { version = "0.12.25", features = ["json"] }
rosu-v2 = "0.11.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "migrate", "chrono"] }
time = "0.3.41"
tokio = { version = "1.47.1", features = ["full"] }
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["fs", "limit"] }
xz2 = "0.1.7"
